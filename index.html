<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);
      padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#faf9f7}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Say–Do Coding Desk</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">

<style>
/* Layout: a fixed index strip over a two-column instrument — the nine dimensions in a left rail,
   the active dimension's Say and Do criteria side by side on the right; stacks to one column on a phone. */
:root{
  --paper:#F6F8FB; --surface:#FFFFFF; --surface-2:#EDF1F7; --surface-3:#E3E9F2;
  --line:#D5DDE9; --line-soft:#E6EBF3;
  --ink:#121923; --ink-2:#56637A; --ink-3:#8692A6;
  --say:#1F62B8; --say-soft:#E7EFFB;
  --do:#BE5120;  --do-soft:#FBEDE5;
  --good:#17724A; --good-soft:#E2F2EA;
  --warn:#9E6A00; --warn-soft:#FAF0DC;
  --bad:#A91F2B;  --bad-soft:#FAE8E9;
  --pos:#64389B;  --pos-soft:#F0E9FA;
  --f-dis:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-en:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0D1117; --surface:#151C26; --surface-2:#1C2531; --surface-3:#25303E;
  --line:#2B3643; --line-soft:#212B37;
  --ink:#E8EDF4; --ink-2:#96A3B6; --ink-3:#6E7C90;
  --say:#6CA6F0; --say-soft:#17283D;
  --do:#F08C57;  --do-soft:#36220F;
  --good:#46BA81; --good-soft:#12301F;
  --warn:#E2A832; --warn-soft:#332710;
  --bad:#EB6D76;  --bad-soft:#36181C;
  --pos:#AD86DC;  --pos-soft:#241836;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0D1117; --surface:#151C26; --surface-2:#1C2531; --surface-3:#25303E;
  --line:#2B3643; --line-soft:#212B37;
  --ink:#E8EDF4; --ink-2:#96A3B6; --ink-3:#6E7C90;
  --say:#6CA6F0; --say-soft:#17283D;
  --do:#F08C57;  --do-soft:#36220F;
  --good:#46BA81; --good-soft:#12301F;
  --warn:#E2A832; --warn-soft:#332710;
  --bad:#EB6D76;  --bad-soft:#36181C;
  --pos:#AD86DC;  --pos-soft:#241836;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-en);margin:0;
     -webkit-text-size-adjust:100%}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;unicode-bidi:isolate}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
a{color:var(--say)}

/* ---------- masthead ---------- */
.mast{background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
.mast-in{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;
         justify-content:space-between;padding-block:18px 14px}
.brand h1{font-family:var(--f-dis);font-size:25px;font-weight:600;letter-spacing:-.015em;line-height:1.1}
.brand .sub{font-family:var(--f-ar);direction:rtl;font-size:14.5px;color:var(--ink-2);margin-top:4px}
.brand .kicker{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
               color:var(--ink-3);font-weight:600;margin-bottom:6px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.field label span{font-family:var(--f-ar);text-transform:none;letter-spacing:0;font-size:11px}
select,input[type=text],input[type=date],input[type=number],textarea{
  background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:7px 9px;font-family:var(--f-en);font-size:13px;min-width:0;width:100%}
textarea{font-size:12.5px;line-height:1.5;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,
.opt:focus-within{outline:2px solid var(--say);outline-offset:2px}

/* ---------- index strip ---------- */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
       background:var(--surface);border-bottom:1px solid var(--line);
       box-shadow:0 1px 0 rgba(0,0,0,.02)}
.strip-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;
          background:var(--line-soft);border-inline:1px solid var(--line-soft)}
.stat{background:var(--surface);padding:9px 12px;min-width:0}
.stat .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .k em{font-family:var(--f-ar);font-style:normal;text-transform:none;letter-spacing:0;font-size:10.5px}
.stat .v{font-family:var(--f-num);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;
         line-height:1.2;margin-top:2px}
.stat .v small{font-size:12px;color:var(--ink-3);font-weight:400}
.stat.say .v{color:var(--say)} .stat.do .v{color:var(--do)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;
      font-size:12px;font-weight:600;line-height:1.3;margin-top:4px;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.b-pend{background:var(--surface-2);color:var(--ink-2)}
.b-coup{background:var(--good-soft);color:var(--good)}
.b-part{background:var(--warn-soft);color:var(--warn)}
.b-sig{background:var(--bad-soft);color:var(--bad)}
.b-pos{background:var(--pos-soft);color:var(--pos)}
.prog{height:4px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;background:var(--say);transition:width .25s ease}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;overflow-x:auto;padding-block:0 0;border-bottom:1px solid var(--line);
      background:var(--surface)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px 9px;
     font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab em{font-family:var(--f-ar);font-style:normal;font-size:12px;color:var(--ink-3);margin-inline-start:7px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--say)}
.tab[aria-selected=true] em{color:var(--say)}

/* ---------- main grid ---------- */
main{padding-block:20px 56px}
.grid{display:grid;grid-template-columns:292px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:1fr}}

.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rail h2{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
         font-weight:600;padding:12px 14px 9px}
.rail h2 em{font-family:var(--f-ar);font-style:normal;text-transform:none;letter-spacing:0;font-size:11.5px}
.dimbtn{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:center;
        width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-soft);
        padding:9px 12px;cursor:pointer}
.dimbtn:hover{background:var(--surface-2)}
.dimbtn[aria-current=true]{background:var(--say-soft)}
.dimbtn .n{font-family:var(--f-num);font-size:11px;font-weight:600;color:var(--ink-3)}
.dimbtn[aria-current=true] .n{color:var(--say)}
.dimbtn .t{font-size:12.5px;font-weight:500;line-height:1.3;min-width:0}
.dimbtn .t b{display:block;font-weight:500}
.dimbtn .t i{display:block;font-family:var(--f-ar);font-style:normal;direction:rtl;text-align:left;
             font-size:11.5px;color:var(--ink-3);margin-top:1px}
.sd{display:flex;gap:3px;font-family:var(--f-num);font-size:11px;font-weight:600}
.sd span{width:19px;height:19px;border-radius:5px;display:grid;place-items:center}
.sd .s{background:var(--say-soft);color:var(--say)}
.sd .d{background:var(--do-soft);color:var(--do)}
.sd .empty{background:var(--surface-2);color:var(--ink-3)}
.sd .pend{box-shadow:inset 0 0 0 1.5px var(--warn)}

/* ---------- panel ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
       padding:18px 20px 22px;min-width:0}
.phead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
       padding-bottom:14px;border-bottom:1px solid var(--line-soft);margin-bottom:16px}
.phead h3{font-family:var(--f-dis);font-size:20px;font-weight:600;letter-spacing:-.01em}
.phead .arname{font-family:var(--f-ar);direction:rtl;font-size:14px;color:var(--ink-2);margin-top:3px}
.anchor{font-family:var(--f-num);font-size:10.5px;font-weight:500;letter-spacing:.04em;
        background:var(--surface-2);color:var(--ink-2);border-radius:6px;padding:4px 9px;white-space:nowrap}

.faces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.faces{grid-template-columns:1fr}}
.face{min-width:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.face > header{padding:10px 13px;border-bottom:1px solid var(--line)}
.face.say > header{background:var(--say-soft)}
.face.do > header{background:var(--do-soft)}
.face header .ttl{font-size:13.5px;font-weight:600;letter-spacing:.01em}
.face.say header .ttl{color:var(--say)} .face.do header .ttl{color:var(--do)}
.face header .gloss{font-size:11.5px;color:var(--ink-2);margin-top:2px;line-height:1.45}
.face header .gloss em{font-family:var(--f-ar);font-style:normal;direction:rtl;display:block;margin-top:2px}
.opts{display:flex;flex-direction:column}
.opt{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;
     padding:10px 13px;border-top:1px solid var(--line-soft);cursor:pointer}
.opt:first-child{border-top:0}
.opt:hover{background:var(--surface-2)}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt .mark{font-family:var(--f-num);font-size:12px;font-weight:600;width:26px;height:26px;
           border-radius:7px;display:grid;place-items:center;background:var(--surface-2);
           color:var(--ink-3);border:1px solid transparent}
.opt .txt{font-size:12.5px;line-height:1.5;min-width:0}
.opt .txt i{font-family:var(--f-ar);font-style:normal;direction:rtl;text-align:right;display:block;
            font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.65}
.face.say .opt[data-on=true]{background:var(--say-soft)}
.face.say .opt[data-on=true] .mark{background:var(--say);color:#fff}
.face.do .opt[data-on=true]{background:var(--do-soft)}
.face.do .opt[data-on=true] .mark{background:var(--do);color:#fff}

.ev{padding:12px 13px 13px;border-top:1px solid var(--line);background:var(--surface-2)}
.ev .lab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
         font-weight:600;margin-bottom:4px}
.ev .lab em{font-family:var(--f-ar);font-style:normal;text-transform:none;letter-spacing:0;font-size:11px}
.ev textarea{min-height:66px}
.ev .src{margin-top:9px}
.gate{display:flex;gap:8px;align-items:flex-start;margin-top:10px;border-radius:8px;
      padding:8px 10px;font-size:11.5px;line-height:1.5}
.gate em{font-family:var(--f-ar);font-style:normal;direction:rtl;display:block;margin-top:3px}
.gate.block{background:var(--bad-soft);color:var(--bad)}
.gate.ok{background:var(--good-soft);color:var(--good)}

.dimgap{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;
        border-top:1px solid var(--line-soft);padding-top:14px}
.dimgap .big{font-family:var(--f-num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.dimgap .cap{font-size:11.5px;color:var(--ink-2);line-height:1.5}
.dimgap .cap em{font-family:var(--f-ar);font-style:normal;direction:rtl;display:block}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;
     font-size:12.5px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--say);border-color:var(--say);color:#fff}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- generic cards / tables ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      padding:18px 20px;margin-bottom:16px}
.card > h3{font-family:var(--f-dis);font-size:17px;font-weight:600;margin-bottom:3px}
.card > .arh{font-family:var(--f-ar);direction:rtl;font-size:13.5px;color:var(--ink-2);margin-bottom:14px}
.card p{font-size:13px;line-height:1.65;color:var(--ink-2);max-width:66ch;margin:0 0 10px}
.card p.ar{font-family:var(--f-ar);font-size:12.5px;line-height:1.85}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.5}
th{background:var(--surface-2);font-weight:600;font-size:11.5px;white-space:nowrap}
td .ar,th .ar{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.7}
td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:center;font-weight:600;width:52px}
.formula{font-family:var(--f-num);font-size:13px;background:var(--surface-2);border:1px solid var(--line);
         border-radius:8px;padding:10px 12px;margin:0 0 10px;overflow-x:auto;white-space:nowrap}

.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kbox{background:var(--surface-2);border-radius:var(--r);padding:12px 14px}
.kbox .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kbox .v{font-family:var(--f-num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px}
.kbox .n{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.45}
.kbox .n em{font-family:var(--f-ar);font-style:normal;direction:rtl;display:block}

.out{width:100%;min-height:230px;font-family:var(--f-num);font-size:11px;line-height:1.6;white-space:pre}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.note em{font-family:var(--f-ar);font-style:normal;direction:rtl;display:block;margin-top:2px}
.modeline{padding:0 0 9px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;
      font-size:10.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);flex:none}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.mx{display:grid;grid-template-columns:200px repeat(var(--cols),minmax(118px,1fr));
    gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:8px;
    overflow:hidden;min-width:min-content}
.mh{background:var(--surface-2);padding:8px 10px;font-size:11.5px;font-weight:600;
    text-align:center}
.mlab{background:var(--surface);padding:8px 10px;font-size:11.5px;line-height:1.35}
.mlab i{display:block;font-family:var(--f-ar);font-style:normal;direction:rtl;text-align:left;
        font-size:11px;color:var(--ink-3);margin-top:1px}
.mcell{background:var(--surface);padding:8px 10px;display:flex;align-items:center;gap:8px}
.mcell .mt{position:relative;flex:1 1 auto;height:15px;background:var(--surface-2);
           border-radius:3px;min-width:52px}
.mcell .mt .zero{position:absolute;inset-block:-2px;left:50%;width:1px;background:var(--ink-3);
                 opacity:.55}
.mcell .mt b{position:absolute;inset-block:2px;display:block;border-radius:2px}
.mcell .mv{font-family:var(--f-num);font-size:12px;font-weight:600;flex:none;width:22px;
           text-align:right;font-variant-numeric:tabular-nums}
/* ---------- charts ---------- */
.chart{display:flex;flex-direction:column;gap:11px;margin:4px 0 6px}
.brow{display:grid;grid-template-columns:118px minmax(0,1fr);gap:11px;align-items:center}
@media (max-width:560px){.brow{grid-template-columns:84px minmax(0,1fr)}}
.brow .lb{font-size:12px;font-weight:500;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.brow .lb i{display:block;font-family:var(--f-ar);font-style:normal;direction:rtl;text-align:left;
            font-size:11px;color:var(--ink-3);margin-top:1px}
.pair{display:flex;flex-direction:column;gap:4px;min-width:0}
.track{position:relative;height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.track b{position:absolute;inset-block:0;left:0;border-radius:4px;display:block}
.track .tick{position:absolute;inset-block:0;width:1px;background:var(--line);opacity:.8}
.track em{position:absolute;right:4px;top:1px;line-height:14px;font-family:var(--f-num);
          font-size:10.5px;font-style:normal;font-weight:600;color:var(--ink-2);
          font-variant-numeric:tabular-nums;background:var(--surface);
          padding:0 5px;border-radius:3px}
.axis{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:10px;
      color:var(--ink-3);margin-top:2px}

.dv{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:11px;align-items:center}
@media (max-width:560px){.dv{grid-template-columns:96px minmax(0,1fr) 38px}}
.dvt{position:relative;height:19px;background:var(--surface-2);border-radius:4px}
.dvt .zero{position:absolute;inset-block:-3px;left:50%;width:1px;background:var(--ink-3);opacity:.55}
.dvt b{position:absolute;inset-block:2px;display:block;border-radius:3px}
.dvv{font-family:var(--f-num);font-size:12px;font-weight:600;text-align:right;
     font-variant-numeric:tabular-nums}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--ink-2);margin:2px 0 14px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:11px;height:11px;border-radius:3px;display:block}
.orglist{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.orgrow{display:flex;gap:8px;align-items:center}
.orgrow input{flex:1 1 auto}
.orgrow .del{background:none;border:1px solid var(--line);border-radius:7px;width:30px;height:30px;
             flex:none;cursor:pointer;color:var(--ink-3);font-size:14px;line-height:1}
.orgrow .del:hover{color:var(--bad);border-color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="mast">
  <div class="wrap mast-in">
    <div class="brand">
      <h1>Say–Do Coding Desk</h1>
      <div class="sub">أداة قياس الفجوة بين ما تعلنه المنظمة وما تفعله</div>
    </div>
    <div class="ctrls">
      <div class="field" style="width:168px">
        <label for="org">Organization <span>المنظمة</span></label>
        <select id="org"></select>
      </div>
      <div class="field" style="width:140px">
        <label for="coder">Coder <span>المُرمِّز</span></label>
        <input type="text" id="coder" placeholder="Coder 1">
      </div>
      <div class="field" style="width:150px">
        <label for="cutoff">Cut-off date <span>تاريخ الإقفال</span></label>
        <input type="date" id="cutoff">
      </div>
      <button class="btn" id="theme" title="Theme">◐</button>
    </div>
  </div>
  <div class="wrap"><div class="tabs" role="tablist" id="tabs"></div></div>
</header>

<div class="strip"><div class="wrap"><div class="strip-in" id="strip"></div>
  <div class="prog"><i id="progbar" style="width:0%"></i></div>
  <div class="note" style="padding:7px 0 9px" id="progtext"></div>

  return {orgs, org:"org_stc", coder:"", cutoff:"2026-09-22", active:0, tab:"coding",
          data:d, c2:c};
}
let S = seed();

  if(p && p.data && p.orgs) S = Object.assign(S, p); } }catch(e){}
function normalise(){
  S.orgs = (S.orgs||[]).filter(o=>o && o.id && typeof o.name === "string");
  if(!S.orgs.length) S.orgs = DEFAULT_ORGS.map(o=>({...o}));
  S.orgs.forEach(o=>{ if(!S.data[o.id]) S.data[o.id] = blank();
                      if(!S.c2[o.id]) S.c2[o.id] = blankC2();
                      });
  if(!S.orgs.some(o=>o.id === S.org)) S.org = S.orgs[0].id;
}
normalise();

const orgName  = id => (S.orgs.find(o=>o.id === id) || {name:id}).name;
const newOrgId = () => "org_" + Math.random().toString(36).slice(2,9);

/* shared-store state */
let DB = null, USER = null, ME = null, MODE = "connecting";
let ROSTER = [];                 // [{id}] every coder who has registered
let PEERS = {};                  // coderId -> {key -> {s,ev,src}}
let NAMES = {};                  // coderId -> display name
let COMPARE = null;              // coderId chosen for the kappa comparison
const subs = [];
const cellKey = (orgId, dim, face) => `${orgId}__${dim}__${face}`;

/* ===================== LOGIC ===================== */
// A face counts only once its evidence is recorded. Score 0 still needs a note
// saying where you looked; any score above 0 also needs a source reference.
function confirmed(f){
  if(!f || f.s === null || f.s === undefined) return false;
  if(!f.ev.trim()) return false;
  if(f.s > 0 && !f.src.trim()) return false;
  return true;
}
function pending(f){ return f && f.s !== null && f.s !== undefined && !confirmed(f); }

function rowsFor(orgId){ return S.data[orgId] || blank(); }

function totals(org){
  const rows = rowsFor(org || S.org);
  let say=0, dou=0, nOK=0, nPend=0, dSum=0, dN=0;
  rows.forEach(r=>{
    if(confirmed(r.say)){ say += r.say.s; nOK++; } else if(pending(r.say)) nPend++;
    if(confirmed(r.do)){ dou += r.do.s; nOK++; } else if(pending(r.do)) nPend++;
    if(confirmed(r.say) && confirmed(r.do)){ dSum += Math.abs(r.say.s - r.do.s); dN++; }
  });
  return {org:org||S.org, say, do:dou, nOK, nPend, whole:nOK===18,
          gapAbs:(say-dou)/MAX*100, gapRel: say>0 ? (say-dou)/say*100 : 0,
          disp: dN ? dSum/dN : null, dN};
}
function band(g){
  if(g < 0)   return {k:"Positive Decoupling", ar:"انفصال إيجابي", c:"b-pos"};
  if(g <= 10) return {k:"Coupled",             ar:"اقتران",        c:"b-coup"};
  if(g <= 30) return {k:"Partial Decoupling",  ar:"انفصال جزئي",   c:"b-part"};
  return        {k:"Significant Decoupling",   ar:"انفصال كبير",   c:"b-sig"};
}

/* quadratically weighted Cohen's kappa over 0-3 */
function kappa(a, b, weighted){
  const k=4, N=a.length; if(!N) return null;
  const O = Array.from({length:k},()=>Array(k).fill(0));
  const r = Array(k).fill(0), c = Array(k).fill(0);
  for(let i=0;i<N;i++){ O[a[i]][b[i]]++; r[a[i]]++; c[b[i]]++; }
  const w = (i,j)=> weighted ? Math.pow(i-j,2)/Math.pow(k-1,2) : (i===j?0:1);
  let num=0, den=0;
  for(let i=0;i<k;i++) for(let j=0;j<k;j++){
    num += w(i,j)*O[i][j];
    den += w(i,j)*r[i]*c[j]/N;
  }
  return den === 0 ? 1 : 1 - num/den;
}
function landis(k){
  if(k < 0)    return ["Poor","ضعيف جداً"];
  if(k <= .20) return ["Slight","طفيف"];
  if(k <= .40) return ["Fair","مقبول"];
  if(k <= .60) return ["Moderate","متوسط"];
  if(k <= .80) return ["Substantial","جوهري"];
  return ["Almost perfect","شبه تام"];
}
const esc = s => String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const f1 = n => (n>=0?"":"−") + Math.abs(n).toFixed(1);

/* my scores for one organization, in the fixed cell order: nine Say, then nine Do */
function myVector(orgId){
  const rows = S.data[orgId] || blank();
  return DIMS.map((_,i)=>rows[i].say.s).concat(DIMS.map((_,i)=>rows[i].do.s));
}
/* another coder's vector, read from the shared store */
function peerVector(coderId, orgId){
  const cells = PEERS[coderId] || {};
  const at = (i,face)=>{ const c = cells[cellKey(orgId,i,face)];
    return c && confirmed(c) ? c.s : null; };
  return DIMS.map((_,i)=>at(i,"say")).concat(DIMS.map((_,i)=>at(i,"do")));
}

/* ===================== SHARED STORE ===================== */
function setMode(m){ MODE = m; }

async function connect(){
  let db = null, user = null;
  try{
    if(typeof window.claude !== "undefined" && window.claude && window.claude.use){
      db = await window.claude.use("db");
      user = await window.claude.use("user");
    }
  }catch(e){}
  if(!db || !user){ setMode("local"); return; }
  DB = db; USER = user;
  try{ ME = await user.id(); }catch(e){ ME = null; }
  if(!ME){ setMode("local"); return; }

  // announce myself so other coders can find me
  try{ await DB.doc("coders/" + ME).set({joinedAt: Date.now()}); }
  catch(e){ setMode("local"); return; }

  setMode("shared");

  // the shared organization list and cut-off date
  subs.push(DB.doc("meta/config").onSnapshot(snap=>{
    const d = snap.exists ? snap.data() : null;
    if(d && Array.isArray(d.orgs) && d.orgs.length){
      S.orgs = d.orgs.filter(o=>o && o.id && typeof o.name === "string")
                     .map(o=>({id:o.id, name:o.name}));
      if(typeof d.cutoff === "string") S.cutoff = d.cutoff;
      normalise();
      const cf = document.getElementById("cutoff"); if(cf) cf.value = S.cutoff;
      render();
    } else if(!snap.exists){
      // first viewer seeds the list from the defaults
      DB.doc("meta/config").set({orgs: S.orgs, cutoff: S.cutoff}).catch(()=>{});
    }
  }, ()=>{}));

  // who else is coding
  subs.push(DB.collection("coders").onSnapshot(snap=>{
    const ids = snap.docs.map(d=>d.id);
    ids.forEach(id=>{ if(!(id in PEERS)){ PEERS[id] = {}; watchCells(id); } });
    ROSTER = ids;
    if(!COMPARE || !ids.includes(COMPARE)) COMPARE = ids.find(i=>i !== ME) || null;
    resolveNames(ids);
    render();
  }, ()=>{}));
}

function watchCells(coderId){
  subs.push(DB.collection("coding/" + coderId + "/cells").onSnapshot(snap=>{
    const bag = {};
    snap.docs.forEach(d=>{
      const v = d.data() || {};
      bag[d.id] = {s: (typeof v.s === "number" ? v.s : null),
                   ev: String(v.ev || ""), src: String(v.src || "")};
    });
    PEERS[coderId] = bag;
    if(coderId === ME) adoptMine(bag);
    render();
  }, ()=>{}));
}

/* my own cells are the authority once the store answers */
function adoptMine(bag){
  S.orgs.forEach(o=>{
    if(!S.data[o.id]) S.data[o.id] = blank();
    DIMS.forEach((_,i)=>{
      ["say","do"].forEach(face=>{
        const c = bag[cellKey(o.id, i, face)];
        S.data[o.id][i][face] = c ? {s:c.s, ev:c.ev, src:c.src} : {s:null, ev:"", src:""};
      });
    });
  });
}

async function resolveNames(ids){
  if(!USER || !ids.length) return;
  try{ const ps = await USER.profiles(ids);
    ids.forEach(id=>{ NAMES[id] = (ps[id] && ps[id].name) || ""; });
    render();
  }catch(e){}
}
const coderLabel = id => id === ME ? ((NAMES[id] || S.coder || "This coder") + " — current view")
                                   : (NAMES[id] || "Coder " + id.slice(-4));

const writeQueue = {};
function pushCell(orgId, dim, face){
  if(MODE !== "shared" || !DB || !ME) return;
  const key = cellKey(orgId, dim, face);
  clearTimeout(writeQueue[key]);
  writeQueue[key] = setTimeout(()=>{
    const f = S.data[orgId][dim][face];
    DB.doc("coding/" + ME + "/cells/" + key)
      .set({s: f.s, ev: f.ev, src: f.src, org: orgName(orgId), dim: dim + 1,
            face: face === "say" ? "Say" : "Do", at: Date.now()})
      .catch(()=>{});
  }, 650);
}
function pushConfig(){
  if(MODE !== "shared" || !DB) return;

}

function renderRel(){
  const shared = MODE === "shared";
  const others = ROSTER.filter(id=>id !== ME);
  const mine = myVector(S.org);
  const theirs = shared && COMPARE ? peerVector(COMPARE, S.org)
                                   : (S.c2[S.org] || blankC2()).slice(0,18);

  const pairs = [];
  for(let i=0;i<18;i++)
    if(mine[i] !== null && mine[i] !== undefined &&
       theirs[i] !== null && theirs[i] !== undefined) pairs.push([mine[i], theirs[i]]);
  const A = pairs.map(p=>p[0]), B = pairs.map(p=>p[1]);
  const kw = pairs.length ? kappa(A,B,true) : null;
  const ku = pairs.length ? kappa(A,B,false) : null;
  const exact = pairs.filter(p=>p[0]===p[1]).length;
  const lab = kw===null ? ["—","—"] : landis(kw);
  const pass = kw !== null && kw >= 0.70;

  const rowsHTML = DIMS.map((d,i)=>["say","do"].map((k,j)=>{
    const idx = j ? i+9 : i;
    const a = mine[idx], b = theirs[idx];
    const diff = (a!==null&&a!==undefined&&b!==null&&b!==undefined) ? Math.abs(a-b) : null;
    const colour = diff===null?"var(--ink-3)":diff===0?"var(--good)":diff===1?"var(--warn)":"var(--bad)";
    const second = shared
      ? `<td class="num">${b===null||b===undefined?"·":b}</td>`
      : `<td class="num"><input type="number" min="0" max="3" step="1" data-c2="${idx}"
           value="${b===null||b===undefined?"":b}" style="width:58px;text-align:center"></td>`;
    return `<tr>
      <td><strong>D${d.n} ${k==="say"?"Say":"Do"}</strong><div class="ar">${esc(d.ar)} — ${k==="say"?"قول":"فعل"}</div></td>
      <td class="num">${a===null||a===undefined?"·":a}</td>
      ${second}
      <td class="num" style="color:${colour}">${diff===null?"·":diff===0?"=":"±"+diff}</td></tr>`;
  }).join("")).join("");

  const picker = shared
    ? (others.length
       ? `<div class="field" style="max-width:280px;margin-bottom:14px">
            <label for="cmp">Compare with <span>المقارنة مع</span></label>
            <select id="cmp">${others.map(id=>
              `<option value="${esc(id)}"${id===COMPARE?" selected":""}>${esc(coderLabel(id))}</option>`
            ).join("")}</select></div>`
       : `<p class="note" style="margin-bottom:14px">No second coder has registered on this instrument yet. A second coder's scores appear here once coding begins.
            <em>لا يوجد مُرمِّز ثانٍ بعد.</em></p>`)
    : `<p class="note" style="margin-bottom:14px">The second coder's scores are entered by hand in this view. In a shared view they arrive on their own.
         <em>أدخل درجات المُرمِّز الثاني يدوياً.</em></p>`;

  document.getElementById("t-rel").innerHTML = `
  <div class="card">
    <h3>Inter-coder reliability — ${esc(orgName(S.org))}</h3>
    <div class="arh">اتفاق المُرمِّزَين — المطلوب κ ≥ ٠٫٧٠ — ${esc(orgName(S.org))}</div>
    ${picker}
    <div class="kgrid">
      <div class="kbox"><div class="k">κ</div>
        <div class="v" style="color:${pass?"var(--good)":"var(--bad)"}">${kw===null?"—":kw.toFixed(3)}</div>
        <div class="n">${esc(lab[0])}<em>${esc(lab[1])}</em></div></div>
      <div class="kbox"><div class="k">Threshold ≥ 0.70</div>
        <div class="v" style="color:${pass?"var(--good)":"var(--bad)"}">${kw===null?"—":(pass?"Met":"Not met")}</div>
        <div class="n">${exact} of ${pairs.length} cells agree<em>${exact} من ${pairs.length} متطابقة</em></div></div>
    </div>
    <div class="scroll"><table>
      <tr><th>Cell <div class="ar">الخلية</div></th>
          <th>${shared?esc(coderLabel(ME||"")):"Coder 1"} <div class="ar">العرض الحالي</div></th>
          <th>${shared&&COMPARE?esc(coderLabel(COMPARE)):"Coder 2"} <div class="ar">المُرمِّز الثاني</div></th>
          <th>Δ</th></tr>
      ${rowsHTML}</table></div>
    <p class="note" style="margin-top:12px;color:var(--warn)">Record κ before changing any score.
      <em>سجّل κ قبل تعديل أي درجة.</em></p>
  </div>`;
}

function renderRef(){
  const gen = GENERAL.map(r=>`<tr><td class="num">${r[0]}</td>
    <td>${esc(r[1])}<div class="ar">${esc(r[2])}</div></td>
    <td>${esc(r[3])}<div class="ar">${esc(r[4])}</div></td></tr>`).join("");
  const rules = RULES.map((r,i)=>`<tr><td class="num">${i+1}</td>
    <td>${esc(r[0])}<div class="ar">${esc(r[1])}</div></td></tr>`).join("");
  const bands = [
    ["Gap &lt; 0%","Positive Decoupling","انفصال إيجابي","Practice runs ahead of declaration.","الممارسة تسبق الإعلان.","b-pos"],
    ["0% ≤ Gap ≤ 10%","Coupled","اقتران","Declaration and practice correspond.","الإعلان والممارسة متوافقان.","b-coup"],
    ["10% &lt; Gap ≤ 30%","Partial Decoupling","انفصال جزئي","A measurable shortfall in practice.","قصور قابل للقياس في الممارسة.","b-part"],
    ["Gap &gt; 30%","Significant Decoupling","انفصال كبير","Declaration substantially unmatched.","الإعلان غير مُقابَل إلى حد كبير.","b-sig"]
  ].map(b=>`<tr><td style="font-family:var(--f-num);white-space:nowrap">${b[0]}</td>
    <td><span class="pill ${b[5]}" style="margin:0"><span class="dot"></span>${b[1]}</span>
      <div class="ar">${b[2]}</div></td>
    <td>${b[3]}<div class="ar">${b[4]}</div></td></tr>`).join("");

  document.getElementById("t-ref").innerHTML = `
  <div class="card">
    <h3>The index</h3><div class="arh">كيف يُحسب المؤشر</div>
    <p>The denominator is 27 because nine dimensions are each scored 0–3 on one face: 9 × 3 = 27 is the maximum a single face can reach. The absolute gap expresses the shortfall as a share of that ceiling; the relative gap expresses it as a share of what was actually declared.</p>
    <div class="formula">Gap<sub>abs</sub> = (Σ Say − Σ Do) ÷ 27 × 100</div>
    <div class="formula">Gap<sub>rel</sub> = (Σ Say − Σ Do) ÷ Σ Say × 100</div>
    <div class="formula">Dispersion = mean( | Say<sub>d</sub> − Do<sub>d</sub> | ) over d = 1…9</div>
    <p class="note">An index computed on totals cannot distinguish congruence at high maturity from congruence at zero: an organization scoring 26 and 26 and one scoring 10 and 10 both read 0.0%. Σ Say and Σ Do are therefore always reported beside the index, never after it.
      <em>منظمة بـ٢٦/٢٦ وأخرى بـ١٠/١٠ كلتاهما ٠٫٠٪ — لذلك يُذكر المجموعان دائماً.</em></p>
  </div>
  <div class="card">
    <h3>Interpretation bands</h3><div class="arh">ماذا تعني كل نسبة</div>
    <div class="scroll"><table><tr><th>Gap<sub>abs</sub></th><th>Band <div class="ar">النطاق</div></th>
      <th>Reading <div class="ar">القراءة</div></th></tr>${bands}</table></div>
  </div>
  <div class="card">
    <h3>The general scale</h3><div class="arh">المقياس العام لكل الأبعاد</div>
    <p>This scale defines what each level means irrespective of dimension. The dimension-specific criteria that a coder actually applies are shown on the Coding tab, under each dimension.</p>
    <div class="scroll"><table>
      <tr><th>Score <div class="ar">الدرجة</div></th>
          <th style="color:var(--say)">Say — declaration <div class="ar">القول — الإعلان</div></th>
          <th style="color:var(--do)">Do — documented practice <div class="ar">الفعل — الممارسة الموثّقة</div></th></tr>
      ${gen}</table></div>
  </div>
  <div class="card">
    <h3>Coding rules</h3><div class="arh">قواعد الترميز الأربع</div>
    <div class="scroll"><table><tr><th>#</th><th>Rule <div class="ar">القاعدة</div></th></tr>${rules}</table></div>
  </div>`;
}

function logText(orgIds){
  const list = orgIds && orgIds.length ? orgIds : [S.org];
  const who = (NAMES[ME] || S.coder || "Coder 1");
  const lines = [["Organization","Coder","Cut-off","Dimension","Anchor","Face","Score",
                  "Evidence","Source","Confirmed"].join("\t")];
  list.forEach(id=>{
    (S.data[id] || blank()).forEach((r,i)=>{
      ["say","do"].forEach(k=>{
        const f = r[k];
        lines.push([orgName(id), who, S.cutoff, `D${DIMS[i].n} ${DIMS[i].en}`, DIMS[i].anchor,
          k==="say"?"Say":"Do", (f.s===null||f.s===undefined)?"":f.s,
          f.ev.replace(/\s+/g," ").trim(), f.src.replace(/\s+/g," ").trim(),
          confirmed(f)?"yes":"no"].join("\t"));
      });
    });
  });
  lines.push("");
  lines.push(["SUMMARY","Sigma Say /27","Sigma Do /27","Gap_abs","Gap_rel","Dispersion",
              "Band","Cells confirmed"].join("\t"));
  list.forEach(id=>{
    const t = totals(id), b = band(t.gapAbs);
    lines.push([orgName(id), t.say, t.do, t.gapAbs.toFixed(1)+"%",
      t.say ? t.gapRel.toFixed(1)+"%" : "n/a",
      t.disp === null ? "n/a" : t.disp.toFixed(2),
      t.whole ? b.k : "pending", t.nOK+"/18"].join("\t"));
  });
  return lines.join("\n");
}

function renderExp(){
  const rows = S.orgs.map((o,i)=>{
    const t = totals(o.id);
    return `<div class="orgrow">
      <input type="text" data-orgname="${i}" value="${esc(o.name)}">
      <span class="note" style="width:60px;flex:none">${t.nOK}/18</span>
      <button class="del" data-orgdel="${i}" title="Remove"
        ${S.orgs.length<2?"disabled":""}>✕</button></div>`;
  }).join("");

  document.getElementById("t-exp").innerHTML = `
  <div class="card">
    <h3>Organizations</h3>
    <div class="arh">أضف أي منظمة، لا الأربع فقط</div>
    <div class="orglist">${rows}</div>
    <div class="row">
      <input type="text" id="neworg" placeholder="Organization name — اسم المنظمة" style="max-width:260px">
      <button class="btn primary" id="addorg">Add — إضافة</button>
      <span class="note" id="orgmsg"></span>
    </div>
  </div>
  <div class="card">
    <h3>Coding log</h3><div class="arh">انسخه والصقه في إكسل</div>
    <div class="row">
      <button class="btn primary" id="copylog">Copy — ${esc(orgName(S.org))}</button>
      <button class="btn" id="copyall">Copy all organizations — نسخ الكل</button>
      <span class="note" id="copymsg"></span>
    </div>
    <textarea class="out" id="logbox" readonly></textarea>
  </div>
  <div class="card">
    <h3>Reset</h3><div class="arh">مسح كل الترميز</div>
    <div class="row">
      <button class="btn" id="clear">Clear this coder's data — مسح بيانات هذا المُرمِّز</button>
      <span class="note" id="clearmsg"></span>
    </div>
  </div>`;
  document.getElementById("logbox").value = logText([S.org]);
}

function renderOrgSel(){
  const sel = document.getElementById("org");
  sel.innerHTML = S.orgs.map(o=>
    `<option value="${esc(o.id)}"${o.id===S.org?" selected":""}>${esc(o.name)}</option>`).join("");
}

function render(){
  renderTabs(); renderOrgSel(); renderStrip();
  if(S.tab==="coding"){ renderRail(); renderPanel(); }
  if(S.tab==="results") renderResults();
  if(S.tab==="rel") renderRel();
  if(S.tab==="ref") renderRef();
  if(S.tab==="exp") renderExp();
  save();
}

/* ===================== EVENTS ===================== */
document.getElementById("coder").value = S.coder;
document.getElementById("cutoff").value = S.cutoff;

document.getElementById("org").addEventListener("change", e=>{ S.org = e.target.value; render(); });
document.getElementById("coder").addEventListener("input", e=>{ S.coder = e.target.value; save(); });
document.getElementById("cutoff").addEventListener("change", e=>{
  S.cutoff = e.target.value; save(); pushConfig(); });
document.getElementById("theme").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
});

document.addEventListener("click", e=>{
  const tab = e.target.closest(".tab");
  if(tab){ S.tab = tab.dataset.tab; render(); return; }
  const dim = e.target.closest(".dimbtn");
  if(dim){ S.active = +dim.dataset.dim; render(); return; }
  if(e.target.id === "prev"){ S.active = Math.max(0, S.active-1); render(); return; }
  if(e.target.id === "next"){ S.active = Math.min(8, S.active+1); render(); return; }

  if(e.target.id === "copylog" || e.target.id === "copyall"){
    const txt = logText(e.target.id === "copyall" ? S.orgs.map(o=>o.id) : [S.org]);
    const box = document.getElementById("logbox"), msg = document.getElementById("copymsg");
    box.value = txt;
    const done = ()=>{ msg.textContent = "Copied — تم النسخ"; setTimeout(()=>msg.textContent="",2600); };
    const fallback = ()=>{ box.focus(); box.select();
      msg.textContent = "Selected — press ⌘/Ctrl+C — مُحدَّد، اضغط ⌘/Ctrl+C"; };
    try{ navigator.clipboard.writeText(txt).then(done, fallback); }catch(err){ fallback(); }
    return;
  }
  if(e.target.id === "addorg"){
    const inp = document.getElementById("neworg"), msg = document.getElementById("orgmsg");
    const name = inp.value.trim();
    if(!name){ msg.textContent = "A name is required — الاسم مطلوب"; return; }
    if(S.orgs.some(o=>o.name === name)){ msg.textContent = "Already in the list — موجودة"; return; }
    const id = newOrgId();
    S.orgs.push({id, name}); S.data[id] = blank(); S.c2[id] = blankC2();
    S.org = id; S.active = 0; S.tab = "coding"; pushConfig(); render(); return;
  }
  const del = e.target.closest("[data-orgdel]");
  if(del && !del.disabled){
    const i = +del.dataset.orgdel, o = S.orgs[i];
    if(del.dataset.armed){
      S.orgs.splice(i,1); delete S.data[o.id]; delete S.c2[o.id];
      if(S.org === o.id) S.org = S.orgs[0].id;
      pushConfig(); render(); return;
    }
    del.dataset.armed = "1"; del.textContent = "!";
    document.getElementById("orgmsg").textContent =
      `Press again to delete ${o.name} and its coding — اضغط مرة أخرى للحذف`;
    return;
  }
  if(e.target.id === "clear"){
    const m = document.getElementById("clearmsg");
    if(e.target.dataset.armed){
      S.orgs.forEach(o=>{
        S.data[o.id] = blank(); S.c2[o.id] = blankC2();
        DIMS.forEach((_,i)=>{ pushCell(o.id,i,"say"); pushCell(o.id,i,"do"); });
      });
      S.active = 0; render(); return; }
    e.target.dataset.armed = "1";
    e.target.textContent = "Press again to confirm — اضغط مرة أخرى للتأكيد";
    m.textContent = "This cannot be undone.";
    return;
  }
});

document.addEventListener("change", e=>{
  const face = e.target.closest(".opts");
  if(face && e.target.type === "radio"){
    S.data[S.org][S.active][face.dataset.face].s = +e.target.value;
    pushCell(S.org, S.active, face.dataset.face);
    render(); return;
  }
  if(e.target.id === "cmp"){ COMPARE = e.target.value; renderRel(); return; }
  if(e.target.dataset.orgname !== undefined){
    const i = +e.target.dataset.orgname, o = S.orgs[i], name = e.target.value.trim();
    const msg = document.getElementById("orgmsg");
    if(!name || (name !== o.name && S.orgs.some(x=>x.name === name))){
      e.target.value = o.name;
      msg.textContent = !name ? "A name is required — الاسم مطلوب" : "Already in the list — موجودة";
      return;
    }
    if(name !== o.name){ o.name = name; pushConfig(); render(); }
    return;
  }
  if(e.target.dataset.c2 !== undefined){
    const v = e.target.value === "" ? null : Math.max(0, Math.min(3, Math.round(+e.target.value)));
    if(!S.c2[S.org]) S.c2[S.org] = blankC2();
    S.c2[S.org][+e.target.dataset.c2] = v; renderRel(); save(); return;
  }
});

/* evidence typing: update state live, refresh the gate without stealing focus */
document.addEventListener("input", e=>{
  const k = e.target.dataset.ev || e.target.dataset.src;
  if(!k) return;
  const cell = S.data[S.org][S.active][k];
  if(e.target.dataset.ev) cell.ev = e.target.value; else cell.src = e.target.value;
  save(); pushCell(S.org, S.active, k);
  renderStrip(); renderRail();
  const box = e.target.closest(".ev").querySelector(".gate");
  box.outerHTML = gateHTML(cell);
});

render();
connect();

</script>

</body>
</html>
