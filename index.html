<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Say–Do Gap Rubric</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
/* Layout: a petrol header band over a single column of cards — download, upload, read. */
:root{
  --paper:#F1EEF7; --surface:#FFFFFF; --surface-2:#F4F1FA; --surface-3:#E6E0F3;
  --line:#DBD4EA; --line-soft:#ECE7F5;
  --ink:#0F1822; --ink-2:#4E5C72; --ink-3:#7F8CA2;
  --brand-1:#2A1550; --brand-2:#5B3A9E; --brand-ink:#EFE9FA;
  --say:#1F62B8; --say-2:#3E86E0; --say-soft:#E4EEFC;
  --do:#C2541F;  --do-2:#E57B3C;  --do-soft:#FCECE1;
  --good:#11684A; --good-soft:#DEF0E7;
  --warn:#8F6000; --warn-soft:#FAEFD6;
  --bad:#9E1C2A;  --bad-soft:#FAE5E7;
  --pos:#0D6E6B;  --pos-soft:#DCF0EF;
  --shadow:0 1px 2px rgba(10,30,50,.05), 0 10px 28px -16px rgba(10,30,50,.22);
  --f-dis:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-en:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0C0814; --surface:#171224; --surface-2:#1F1830; --surface-3:#2B2240;
  --line:#362C4C; --line-soft:#261E38;
  --ink:#E9EFF6; --ink-2:#97A6BA; --ink-3:#6E7E93;
  --brand-1:#1A0C33; --brand-2:#3E2770; --brand-ink:#E4DAF6;
  --say:#5F9FEE; --say-2:#8CBCF5; --say-soft:#142740;
  --do:#EE8A52;  --do-2:#F5A878;  --do-soft:#33200F;
  --good:#3FB884; --good-soft:#0F2E20;
  --warn:#DDA32E; --warn-soft:#30250F;
  --bad:#ED6B75;  --bad-soft:#35171B;
  --pos:#3FB3AE;  --pos-soft:#0E2B2A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0C0814; --surface:#171224; --surface-2:#1F1830; --surface-3:#2B2240;
  --line:#362C4C; --line-soft:#261E38;
  --ink:#E9EFF6; --ink-2:#97A6BA; --ink-3:#6E7E93;
  --brand-1:#1A0C33; --brand-2:#3E2770; --brand-ink:#E4DAF6;
  --say:#5F9FEE; --say-2:#8CBCF5; --say-soft:#142740;
  --do:#EE8A52;  --do-2:#F5A878;  --do-soft:#33200F;
  --good:#3FB884; --good-soft:#0F2E20;
  --warn:#DDA32E; --warn-soft:#30250F;
  --bad:#ED6B75;  --bad-soft:#35171B;
  --pos:#3FB3AE;  --pos-soft:#0E2B2A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-en);margin:0;
     -webkit-text-size-adjust:100%}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;unicode-bidi:isolate}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
a{color:var(--say)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}

.mast{background:linear-gradient(160deg,var(--brand-1) 0%,var(--brand-2) 100%);
      color:var(--brand-ink);position:relative;overflow:hidden}
.mast-in{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:12px 24px;
         align-items:flex-end;justify-content:space-between;padding-block:30px 24px}
.mast .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;
               opacity:.72;margin-bottom:9px}
.mast h1{font-family:var(--f-dis);font-size:31px;font-weight:600;letter-spacing:-.02em;
         line-height:1.05;color:#fff}
@media (max-width:560px){.mast h1{font-size:25px}}
.mast .sub{font-family:var(--f-ar);direction:rtl;font-size:14.5px;opacity:.82;margin-top:7px}
.mast .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
.mast .btn:hover{background:rgba(255,255,255,.2)}
.tabbar{position:relative;z-index:1;background:rgba(255,255,255,.07);
        border-top:1px solid rgba(255,255,255,.14)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:7px 0}
.tab{background:none;border:0;border-radius:999px;padding:7px 15px;
     font-size:13px;font-weight:500;color:rgba(255,255,255,.72);cursor:pointer;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.12)}
.tab em{font-family:var(--f-ar);font-style:normal;font-size:12px;opacity:.72;margin-inline-start:7px}
.tab[aria-selected=true]{background:#fff;color:var(--brand-1);font-weight:600}
.tab[aria-selected=true] em{opacity:.66}

main{padding-block:20px 56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.card > h3{font-family:var(--f-dis);font-size:19px;font-weight:600;letter-spacing:-.01em;
           margin-bottom:3px}
.card > .arh{font-family:var(--f-ar);direction:rtl;font-size:13.5px;color:var(--ink-2);
             padding-bottom:13px;margin-bottom:15px;border-bottom:1px solid var(--line-soft)}
.card p{font-size:13px;line-height:1.65;color:var(--ink-2);max-width:68ch;margin:0 0 10px}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.note em{font-family:var(--f-ar);font-style:normal;direction:rtl;display:block;margin-top:2px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.field label span{font-family:var(--f-ar);text-transform:none;letter-spacing:0;font-size:11px}
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-family:var(--f-en);font-size:13px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--say);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 16px;
     font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:linear-gradient(150deg,var(--say),var(--say-2));
             border-color:transparent;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:default}

.steps{display:grid;gap:10px;margin:4px 0 16px}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;align-items:start}
.step .n{width:26px;height:26px;border-radius:50%;
         background:linear-gradient(150deg,var(--say),var(--say-2));color:#fff;
         font-family:var(--f-num);font-size:12px;font-weight:600;display:grid;place-items:center}
.step .t{font-size:13.5px;line-height:1.5;padding-top:3px}
.step .t i{display:block;font-family:var(--f-ar);font-style:normal;direction:rtl;text-align:right;
           font-size:12.5px;color:var(--ink-2);margin-top:2px}

.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 22px;text-align:center;
      background:var(--surface-2);cursor:pointer;transition:border-color .15s, background .15s}
.drop:hover,.drop.over{border-color:var(--say);background:var(--say-soft)}
.drop .big{font-size:14px;font-weight:600;margin-bottom:3px}
.drop .ar{font-size:12.5px;color:var(--ink-2);text-align:center}

.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;
        border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;
        background:var(--surface-2)}
.setrow .who{font-size:13px;font-weight:600;min-width:0}
.setrow .who i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);font-weight:400}
.setrow .st{font-family:var(--f-num);font-size:12px;font-weight:600}
.setrow .x{background:none;border:1px solid var(--line);border-radius:7px;width:30px;height:30px;
           cursor:pointer;color:var(--ink-3)}
.setrow .x:hover{color:var(--bad);border-color:var(--bad)}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.5}
th{background:var(--surface-2);font-weight:600;font-size:11.5px;white-space:nowrap}
td .ar,th .ar{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.7}
td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:center;font-weight:600;width:56px}
.formula{font-family:var(--f-num);font-size:13px;background:var(--surface-2);border:1px solid var(--line);
         border-radius:8px;padding:10px 12px;margin:0 0 10px;overflow-x:auto;white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;
      font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.b-coup{background:var(--good-soft);color:var(--good)}
.b-part{background:var(--warn-soft);color:var(--warn)}
.b-sig{background:var(--bad-soft);color:var(--bad)}
.b-pos{background:var(--pos-soft);color:var(--pos)}
.b-pend{background:var(--surface-3);color:var(--ink-2)}

.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kbox{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);
      padding:14px 16px}
.kbox .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kbox .v{font-family:var(--f-num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px}
.kbox .n{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.45}
.kbox .n em{font-family:var(--f-ar);font-style:normal;direction:rtl;display:block}

.chart{display:flex;flex-direction:column;gap:11px;margin:4px 0 6px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:11px;align-items:center}
@media (max-width:560px){.brow{grid-template-columns:96px minmax(0,1fr)}}
.brow .lb{font-size:12px;font-weight:500;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.brow .lb i{display:block;font-style:normal;font-size:11px;color:var(--ink-3);font-weight:400}
.pair{display:flex;flex-direction:column;gap:4px;min-width:0}
.track{position:relative;height:20px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.track b{position:absolute;inset-block:0;left:0;border-radius:999px;display:block}
.track .tick{position:absolute;inset-block:0;width:1px;background:var(--line);opacity:.8}
.track em{position:absolute;right:5px;top:3px;line-height:14px;font-family:var(--f-num);
          font-size:10.5px;font-style:normal;font-weight:600;color:var(--ink-2);
          font-variant-numeric:tabular-nums;background:var(--surface);padding:0 5px;border-radius:3px}
.axis{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:10px;
      color:var(--ink-3);margin-top:2px}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--ink-2);margin:2px 0 14px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:11px;height:11px;border-radius:3px;display:block}

.mx{display:grid;grid-template-columns:200px repeat(var(--cols),minmax(118px,1fr));
    gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:8px;
    overflow:hidden;min-width:min-content}
.mh{background:var(--surface-2);padding:8px 10px;font-size:11.5px;font-weight:600;text-align:center}
.mlab{background:var(--surface);padding:8px 10px;font-size:11.5px;line-height:1.35}
.mlab i{display:block;font-family:var(--f-ar);font-style:normal;direction:rtl;text-align:left;
        font-size:11px;color:var(--ink-3);margin-top:1px}
.mcell{background:var(--surface);padding:8px 10px;display:flex;align-items:center;gap:8px}
.mcell .mt{position:relative;flex:1 1 auto;height:15px;background:var(--surface-2);
           border-radius:3px;min-width:52px}
.mcell .mt .zero{position:absolute;inset-block:-2px;left:50%;width:1px;background:var(--ink-3);opacity:.55}
.mcell .mt b{position:absolute;inset-block:2px;display:block;border-radius:2px}
.mcell .mv{font-family:var(--f-num);font-size:12px;font-weight:600;flex:none;width:22px;
           text-align:right;font-variant-numeric:tabular-nums}

.pass{border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;margin-bottom:10px;
      background:var(--surface-2)}
.pass-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.pass-head .src{font-family:var(--f-num);font-size:10.5px;color:var(--ink-3)}
.pass .quote{font-size:12.5px;line-height:1.65;color:var(--ink);margin:0 0 9px;
             max-width:none;border-left:3px solid var(--line);padding-left:11px}
.sigs{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:600;
      background:var(--surface-3);color:var(--ink-2)}
.chip.t{background:var(--surface-3);color:var(--ink-2)}
.chip.d{background:var(--do-soft);color:var(--do)}
.chip.s{background:var(--say-soft);color:var(--say)}
.chip.g{background:#F6EFE2;color:#8A5A00}
.b-do{background:var(--do-soft);color:var(--do)}
.b-say{background:var(--say-soft);color:var(--say)}
.btn.mini{padding:4px 10px;font-size:11px;margin-inline-start:auto}
details summary::-webkit-details-marker{color:var(--ink-3)}
.airow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;
        padding-top:14px;border-top:1px solid var(--line-soft)}
.airow .btn.mini{margin-inline-start:0}
.aibox{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:14px;
       background:var(--surface-2)}
.aigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.aicell{background:var(--surface);border:1px solid var(--line-soft);border-radius:9px;padding:11px 13px}
.aicell .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.aicell .v{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1.1;margin:2px 0 3px}
.aicell .n{font-size:11.5px;color:var(--ink-2);line-height:1.5}
.aicell .n em{font-family:var(--f-en);font-style:italic;display:block;margin-top:3px;color:var(--ink)}
.out{width:100%;min-height:220px;font-family:var(--f-num);font-size:11px;line-height:1.6;white-space:pre}
.bad-row{background:var(--bad-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="mast">
  <div class="wrap mast-in">
    <div>
      <div class="eyebrow">OECD · NIST AI RMF · SDAIA</div>
      <h1>Say–Do Gap Rubric</h1>
      <div class="sub">أداةٌ لقياس الفجوة بين ما تُعلنه المنظمة وما تُثبته أدلتها</div>
    </div>
    <button class="btn" id="theme" title="Theme">◐</button>
  </div>
  <div class="tabbar"><div class="wrap"><div class="tabs" role="tablist" id="tabs"></div></div></div>
</header>

<main class="wrap">
  <section id="t-start"></section>
  <section id="t-analyse" hidden></section>
  <section id="t-results" hidden></section>
  <section id="t-rel" hidden></section>
  <section id="t-ref" hidden></section>
</main>

<script>
/* The instrument, as set out in the coding manual. */
const DIMS = [
{n:1, en:"Governance structures and accountability", ar:"هياكل الحوكمة والمساءلة",
 anchor:"NIST GOVERN · OECD Accountability · SDAIA Accountability & Responsibility",
 say:[
 ["No mention of AI governance bodies, roles or accountability.",
  "لا ذكر لجهات حوكمة الذكاء الاصطناعي ولا لأدوارها ولا للمساءلة عنها."],
 ["A general claim of being “accountable” or “responsible” for AI, naming no body, role or process.",
  "ادّعاء عام بالمساءلة أو المسؤولية عن الذكاء الاصطناعي، دون تسمية جهة أو دور أو إجراء."],
 ["Names a governance body or role responsible for AI and describes its remit in general terms.",
  "تسمية جهة حوكمة أو دور مسؤول عن الذكاء الاصطناعي، مع وصف عام لاختصاصه."],
 ["Names the body or role, its reporting line, its remit, and the decisions it owns.",
  "تسمية الجهة أو الدور، وخط تبعيته، واختصاصه، والقرارات التي يملكها."]],
 do:[
 ["No published evidence that any AI governance body or role exists.",
  "لا دليل منشور على وجود أي جهة أو دور لحوكمة الذكاء الاصطناعي."],
 ["Indirect traces only — a role mentioned in passing, a job posting, a conference biography — with no published remit.",
  "آثار غير مباشرة فحسب: دور يُذكر عرضاً، أو إعلان وظيفة، أو نبذة في مؤتمر، دون اختصاص منشور."],
 ["The body or role appears in an annual, governance or sustainability report with at least one described activity or output.",
  "ورود الجهة أو الدور في تقرير سنوي أو حوكمي أو تقرير استدامة، مع نشاط أو مُخرَج موصوف واحد على الأقل."],
 ["Published terms of reference, governance chart with a named accountable executive, or documented decisions and escalations.",
  "لائحة اختصاصات منشورة، أو هيكل حوكمة يحمل اسم تنفيذي مسؤول، أو قرارات وتصعيدات موثّقة."]]},

{n:2, en:"Risk identification and context mapping", ar:"تحديد المخاطر وتوصيف السياق",
 anchor:"NIST MAP · SDAIA four-tier risk classification",
 say:[
 ["No mention of identifying or classifying AI risk.",
  "لا ذكر لتحديد مخاطر الذكاء الاصطناعي ولا لتصنيفها."],
 ["General reference to “managing AI risks” with no method described.",
  "إشارة عامة إلى إدارة مخاطر الذكاء الاصطناعي، دون وصف منهجية."],
 ["States a methodology for identifying and classifying AI risk in general terms, such as risk tiers or pre-deployment impact assessment.",
  "بيان منهجية لتحديد مخاطر الذكاء الاصطناعي وتصنيفها بصورة عامة، كمستويات المخاطر أو تقييم الأثر قبل النشر."],
 ["States the methodology with defined risk categories, the criteria that place a system in each, and the lifecycle point at which it is applied.",
  "بيان المنهجية بفئات مخاطر محددة، ومعايير إدراج النظام في كل فئة، ومرحلة دورة الحياة التي تُطبَّق عندها."]],
 do:[
 ["No published evidence of risk identification in practice.",
  "لا دليل منشور على تحديد المخاطر عملياً."],
 ["A general claim that assessments are performed, with no artifact.",
  "ادّعاء عام بإجراء التقييمات، دون أي مُخرَج."],
 ["At least one published artifact: an impact-assessment summary, a risk-register extract, or a system publicly placed in a risk tier.",
  "مُخرَج منشور واحد على الأقل: ملخص تقييم أثر، أو مقتطف من سجل المخاطر، أو نظام مُصنَّف علناً ضمن مستوى مخاطر."],
 ["Artifacts across several systems or periods showing the methodology applied repeatedly, with dates.",
  "مُخرَجات تشمل أنظمة أو فترات متعددة تُظهر تطبيقاً متكرراً للمنهجية، مؤرَّخة."]]},

{n:3, en:"Measurement, testing and evaluation", ar:"القياس والاختبار والتقييم",
 anchor:"NIST MEASURE · OECD Transparency & Accountability",
 say:[

const CRCT = (()=>{ const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0; }

const enc = s => new TextEncoder().encode(s);

/* store-only zip (no compression) — Excel reads it */
function zip(files){
  const parts = [], central = [];
  let off = 0;
  const w = (n, len)=>{ const a = new Uint8Array(len);
    for(let i=0;i<len;i++) a[i] = (n >>> (8*i)) & 0xFF; return a; };
  files.forEach(f=>{
    const name = enc(f.name), data = f.data, c = crc32(data);
    const head = [enc("PK\x03\x04"), w(20,2), w(0x800,2), w(0,2), w(0,2), w(0,2),
                  w(c,4), w(data.length,4), w(data.length,4), w(name.length,2), w(0,2), name];
    const hlen = head.reduce((n,a)=>n+a.length,0);
    parts.push(...head, data);
    central.push([enc("PK\x01\x02"), w(20,2), w(20,2), w(0x800,2), w(0,2), w(0,2), w(0,2),
                  w(c,4), w(data.length,4), w(data.length,4), w(name.length,2),
                  w(0,2), w(0,2), w(0,2), w(0,2), w(0,4), w(off,4), name]);
    off += hlen + data.length;
  });
  const cparts = central.flat();
  const clen = cparts.reduce((n,a)=>n+a.length,0);
  const eocd = [enc("PK\x05\x06"), w(0,2), w(0,2), w(files.length,2), w(files.length,2),
                w(clen,4), w(off,4), w(0,2)];
  const all = [...parts, ...cparts, ...eocd];
  const total = all.reduce((n,a)=>n+a.length,0);
  const out = new Uint8Array(total);
  let p = 0; all.forEach(a=>{ out.set(a,p); p += a.length; });
  return out;
}

/* rows: array of {cells:[{v, s, num}], h} ; cols: [{w}] */
function sheetXml(rows, cols, merges, validations, freeze){
  const body = rows.map((r,i)=>{
    const n = i + 1;
    const cells = r.cells.map((c,j)=>{
      if(c == null) return "";
      const ref = colName(j) + n, s = c.s ? ` s="${c.s}"` : "";
      if(c.v === "" || c.v == null) return `<c r="${ref}"${s}/>`;
      if(c.num) return `<c r="${ref}"${s}><v>${xe(c.v)}</v></c>`;
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xe(c.v)}</t></is></c>`;
    }).join("");
    return `<row r="${n}"${r.h?` ht="${r.h}" customHeight="1"`:""}>${cells}</row>`;
  }).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView tabSelected="1" workbookViewId="0">
<pane ySplit="${freeze}" topLeftCell="A${freeze+1}" activePane="bottomLeft" state="frozen"/>
</sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
<cols>${cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.w}" customWidth="1"/>`).join("")}</cols>
<sheetData>${body}</sheetData>
${merges.length?`<mergeCells count="${merges.length}">${merges.map(m=>`<mergeCell ref="${m}"/>`).join("")}</mergeCells>`:""}
${validations.length?`<dataValidations count="${validations.length}">${validations.map(v=>
  `<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="${v.sqref}"><formula1>"${v.list}"</formula1></dataValidation>`).join("")}</dataValidations>`:""}
</worksheet>`;
}

/* ---------------- reading an .xlsx back into an array of arrays ---------------- */
async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eo = u8.length - 22;
  while(eo >= 0 && dv.getUint32(eo, true) !== 0x06054b50) eo--;
  if(eo < 0) throw new Error("This does not look like an Excel file.");
  const n = dv.getUint16(eo+10, true);
  let p = dv.getUint32(eo+16, true);
  const out = {};
  for(let i=0;i<n;i++){
    const method = dv.getUint16(p+10, true);
    const csize  = dv.getUint32(p+20, true);
    const nlen   = dv.getUint16(p+28, true);
    const elen   = dv.getUint16(p+30, true);
    const clen   = dv.getUint16(p+32, true);
    const lho    = dv.getUint32(p+42, true);
    const name   = new TextDecoder().decode(u8.subarray(p+46, p+46+nlen));
    const lnlen  = dv.getUint16(lho+26, true), lelen = dv.getUint16(lho+28, true);
    const start  = lho + 30 + lnlen + lelen;
    const raw    = u8.subarray(start, start + csize);
    if(method === 0) out[name] = new TextDecoder().decode(raw);
    else if(typeof DecompressionStream === "function"){
      const ds = new DecompressionStream("deflate-raw");
      const blob = new Blob([raw]).stream().pipeThrough(ds);
      out[name] = await new Response(blob).text();
    } else throw new Error("This browser cannot open compressed Excel files. Save the file as CSV instead.");
    p += 46 + nlen + elen + clen;
  }
  return out;
}

async function readXlsx(buf){
  const parts = await unzip(buf);
  const shared = [];
  const ss = parts["xl/sharedStrings.xml"];
  if(ss) (ss.match(/<si>[\s\S]*?<\/si>/g) || []).forEach(si=>{
    shared.push((si.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [])
      .map(t=>t.replace(/<[^>]+>/g,"")).join(""));
  });
  const key = Object.keys(parts).find(k=>/^xl\/worksheets\/sheet1\.xml$/.test(k))
           || Object.keys(parts).find(k=>/^xl\/worksheets\//.test(k));
  const xml = parts[key] || "";
  const un = s => s.replace(/&lt;/g,"<").replace(/&gt;/g,">")
                   .replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
  const aoa = [];
  (xml.match(/<row[\s\S]*?<\/row>|<row[^>]*\/>/g) || []).forEach(rx=>{
    const row = [];
    (rx.match(/<c [^>]*\/>|<c [^>]*>[\s\S]*?<\/c>/g) || []).forEach(cx=>{
      const ref = /r="([A-Z]+\d+)"/.exec(cx);
      const j = ref ? colIndex(ref[1]) : row.length;
      const t = /t="([^"]+)"/.exec(cx);
      let v = "";
      if(t && t[1] === "inlineStr"){
        v = (cx.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || []).map(x=>x.replace(/<[^>]+>/g,"")).join("");
      } else {
        const m = /<v>([\s\S]*?)<\/v>/.exec(cx);
        v = m ? m[1] : "";
        if(t && t[1] === "s") v = shared[+v] || "";
      }
      row[j] = un(v);
    });
    aoa.push(row);
  });
  return aoa;
}

function band(g){
  if(g < 0)   return {k:"Positive Decoupling", ar:"انفصال إيجابي", c:"b-pos"};
  if(g <= 10) return {k:"Coupled",             ar:"اقتران",        c:"b-coup"};
  if(g <= 30) return {k:"Partial Decoupling",  ar:"انفصال جزئي",   c:"b-part"};
  return        {k:"Significant Decoupling",   ar:"انفصال كبير",   c:"b-sig"};
}

/* quadratically weighted Cohen's kappa over 0-3 */
function kappa(a, b){
  const k=4, N=a.length; if(!N) return null;
  const O = Array.from({length:k},()=>Array(k).fill(0));
  const r = Array(k).fill(0), c = Array(k).fill(0);
  for(let i=0;i<N;i++){ O[a[i]][b[i]]++; r[a[i]]++; c[b[i]]++; }
  const w = (i,j)=> Math.pow(i-j,2)/9;
  let num=0, den=0;
  for(let i=0;i<k;i++) for(let j=0;j<k;j++){
    num += w(i,j)*O[i][j];
    den += w(i,j)*r[i]*c[j]/N;
  }
  return den === 0 ? 1 : 1 - num/den;
}
function landis(k){
  if(k < 0)    return ["Poor","ضعيف جداً"];
  if(k <= .20) return ["Slight","طفيف"];
  if(k <= .40) return ["Fair","مقبول"];
  if(k <= .60) return ["Moderate","متوسط"];
  if(k <= .80) return ["Substantial","جوهري"];
  return ["Almost perfect","شبه تام"];
}

const csvCell = v => {
  const s = String(v==null?"":v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
};
const toCSV = rows => "\ufeff" + rows.map(r=>r.map(csvCell).join(",")).join("\r\n");

function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = "", q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if(c === '"'){ q = true; }
    else if(c === ","){ row.push(cell); cell = ""; }
    else if(c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if(c === "\r"){ /* ignore */ }
    else cell += c;
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

function critCell(crit){
  return crit.map((c,i)=>`${i} = ${c[0]}`).join("\n")
       + "\n\n"
       + crit.map((c,i)=>`${i} = ${c[1]}`).join("\n");
}

}

/* ===================== READING A FILLED FORM ===================== */
const norm = s => String(s==null?"":s).trim();
const dimIndexOf = txt => {
  const m = /^D\s*([1-9])\b/i.exec(norm(txt));
  if(m) return +m[1] - 1;
  return DIMS.findIndex(d=>norm(txt).toLowerCase().startsWith(d.en.toLowerCase().slice(0,18)));
};

function readForm(text, filename){
  return readAoa(parseCSV(text), filename);
}

function readAoa(table, filename){
  let aoa = table.filter(r=>r.some(c=>norm(c)));
  if(!aoa.length) throw new Error("The file is empty.");

  /* the header row is wherever "Dimension" is */
  const hi = aoa.findIndex(r=>r.some(c=>norm(c).toLowerCase().startsWith("dimension")));
  if(hi < 0) throw new Error("This file does not look like the form: the Dimension column is missing.");
  aoa = aoa.slice(hi);

  const head = aoa[0].map(x=>norm(x).toLowerCase());
  const col = key => head.findIndex(h=>h.startsWith(key));
  const cOrg = col("organization"), cCoder = col("coder"), cCut = col("cut-off"),
        cDim = col("dimension"), cFace = col("facet") >= 0 ? col("facet") : col("face");
  if(cDim < 0) throw new Error("This file does not look like the form: the Dimension column is missing.");

  /* one row per dimension, the two faces side by side; a file downloaded
     before this layout carries a Facet column and one face per row. */
  const wide = cFace < 0;
  const pick = (face, key) => {
    const k = (wide ? face.toLowerCase() + " " : "") + key;
    return head.findIndex(h=>h.startsWith(k));
  };
  const CC = {};
  FACES.forEach(f=>{
    CC[f] = {score:pick(f,"score"), title:pick(f,"source title"), url:pick(f,"url"),
             acc:pick(f,"accessed"), loc:pick(f,"locator"), quote:pick(f,"quotation"),
             why:pick(f,"reasoning")};
  });
  if(CC.Say.score < 0 || CC.Do.score < 0)
    throw new Error("This file does not look like the form: a Score column is missing.");

  const rows = [], issues = [], seen = {};
  let org = "", coder = "", cutoff = "";
  aoa.slice(1).forEach((r, n)=>{
    const line = n + 2 + hi;
    if(!norm(r[cDim])) return;
    org    = org    || norm(r[cOrg]);
    coder  = coder  || norm(r[cCoder]);
    cutoff = cutoff || norm(r[cCut]);

    const di = dimIndexOf(r[cDim]);
    if(di < 0 || di > 8){
      issues.push({line, why:"The dimension could not be read.",
                   ar:"تعذّرت قراءة البُعد."});
      return;
    }
    const faces = wide ? FACES
      : [/^do/i.test(norm(r[cFace])) ? "Do" : /^say/i.test(norm(r[cFace])) ? "Say" : ""];
    if(!faces[0]){
      issues.push({line, why:"The face could not be read.", ar:"تعذّرت قراءة الوجه."});
      return;
    }

    faces.forEach(face=>{
      const c = CC[face], g = k => norm(r[c[k]]);
      const tag = `D${di+1} ${face}`;
      const raw = g("score");
      const title = g("title"), url = g("url"), acc = g("acc"),
            loc = g("loc"), quote = g("quote"), why = g("why");
      if(raw === ""){ issues.push({line, why:`${tag}: no score.`, ar:"لم تُسجَّل درجة."}); return; }
      const s = Number(raw);
      if(!Number.isInteger(s) || s < 0 || s > 3){
        issues.push({line, why:`${tag}: the score must be 0, 1, 2 or 3.`,
                     ar:"يجب أن تكون الدرجة ٠ أو ١ أو ٢ أو ٣."}); return;
      }
      if(!why){
        issues.push({line, why:`${tag}: no reasoning. Every decision records why this level and not the one above or below.`,
                     ar:"بلا تسبيب. يُسجَّل لكل قرار سبب اختيار هذا المستوى دون ما فوقه أو دونه."}); return;
      }
      if(s > 0 && (!title || !url || !quote || !acc)){
        issues.push({line, why:`${tag}: a score above zero requires a source title, a URL, the date it was accessed, and the quotation it rests on.`,
                     ar:"تتطلب الدرجة فوق الصفر عنوان المصدر ورابطه وتاريخ الاطّلاع عليه والاقتباس الذي تستند إليه."}); return;
      }
      if(seen[tag]){
        issues.push({line, why:`${tag}: this cell is filled in more than once.`,
                     ar:"الخلية مكررة."}); return;
      }
      seen[tag] = 1;
      rows.push({dim:di, face, score:s, title, url, acc, loc, quote, why});
    });
  });

  return {id:++SEQ, file:filename, org:org||"—", coder:coder||"—", cutoff, rows, issues};
}

function addFiles(list){
  const files = Array.from(list);
  if(!files.length) return;
  let done = 0;
  const finish = ()=>{ if(++done === files.length){ PAIR = [0, SETS.length>1?1:0]; render(); } };
  files.forEach(file=>{
    const fail = msg => SETS.push({id:++SEQ, file:file.name, org:"—", coder:"—", cutoff:"",
                                   rows:[], issues:[{line:"—", why:msg,
                                                     ar:"تعذّرت قراءة الملف."}]});
    const fr = new FileReader();
    if(/\.xlsx$/i.test(file.name)){
      fr.onload = async () => {
        try{ SETS.push(readAoa(await readXlsx(fr.result), file.name)); }
        catch(err){ fail(err.message); }
        finish();
      };
      fr.onerror = finish;
      fr.readAsArrayBuffer(file);
    } else {
      fr.onload = () => {
        try{ SETS.push(readForm(String(fr.result), file.name)); }
        catch(err){ fail(err.message); }
        finish();
      };
      fr.onerror = finish;
      fr.readAsText(file, "utf-8");
    }
  });
}

function totals(set){
  let say=0, dou=0, nS=0, nD=0;
  set.rows.forEach(r=>{ if(r.face==="Say"){ say+=r.score; nS++; } else { dou+=r.score; nD++; } });
  const whole = nS===9 && nD===9;
  return {say, do:dou, n:nS+nD, whole,
          gapAbs:(say-dou)/MAX*100, gapRel: say>0 ? (say-dou)/say*100 : null};
}
function cellOf(set, dim, face){
  return set.rows.find(r=>r.dim===dim && r.face===face) || null;
}
function dimGap(set, dim){
  const a = cellOf(set,dim,"Say"), b = cellOf(set,dim,"Do");
  return (a && b) ? a.score - b.score : null;
}
function vectorOf(set){
  return DIMS.map((_,i)=>{ const c = cellOf(set,i,"Say"); return c?c.score:null; })
   .concat(DIMS.map((_,i)=>{ const c = cellOf(set,i,"Do"); return c?c.score:null; }));
}

function logText(){
  const flat = v => String(v||"").replace(/\s+/g," ").trim();
  const lines = [["Coder","Organization","Dimension","Facet","Score","Source title",
                  "URL","Accessed","Locator","Quotation","Reasoning"].join("\t")];
  SETS.forEach(s=>{
    DIMS.forEach((d,i)=>FACES.forEach(face=>{
      const c = cellOf(s,i,face);
      if(!c) return;
      lines.push([s.coder, s.org, `D${d.n} ${d.en}`, face, c.score, flat(c.title),
        flat(c.url), flat(c.acc), flat(c.loc), flat(c.quote),
        flat(c.why)].join("\t"));
    }));
  });
  lines.push("");
  lines.push(["SUMMARY","Coder","Sigma Say /27","Sigma Do /27","Gap_abs","Gap_rel","Band"].join("\t"));
  SETS.filter(s=>s.rows.length).forEach(s=>{
    const t = totals(s), b = band(t.gapAbs);
    lines.push([s.org, s.coder, t.say, t.do, t.gapAbs.toFixed(1)+"%",
      t.gapRel===null?"n/a":t.gapRel.toFixed(1)+"%",
      t.whole?b.k:"incomplete"].join("\t"));
  });
  return lines.join("\n");
}

function renderRel(){
  const el = document.getElementById("t-rel");
  if(SETS.length < 2){
    el.innerHTML = `<div class="card"><h3>Inter-coder reliability</h3>
      <div class="arh">ثبات الترميز بين المُرمِّزَين — الحد المطلوب κ ≥ ٠٫٧٠</div>
      <p class="note">Upload two filled forms for the same organization, one from each coder.
      <em>يلزم رفع نموذجين معبّأين للمنظمة ذاتها، واحدٍ من كل مُرمِّز.</em></p></div>`;
    return;
  }
  const A = SETS[PAIR[0]], B = SETS[PAIR[1]];
  const va = vectorOf(A), vb = vectorOf(B);
  const pairs = [];
  for(let i=0;i<18;i++) if(va[i]!==null && vb[i]!==null) pairs.push([va[i], vb[i]]);
  const kw = pairs.length ? kappa(pairs.map(p=>p[0]), pairs.map(p=>p[1])) : null;
  const exact = pairs.filter(p=>p[0]===p[1]).length;
  const lab = kw===null ? ["—","—"] : landis(kw);
  const pass = kw !== null && kw >= 0.70;
  const sameOrg = A.org === B.org;

  const sel = (which, val) => `<select data-pair="${which}">${
    SETS.map((s,i)=>`<option value="${i}"${i===val?" selected":""}>${esc(setLabel(s))}</option>`).join("")}</select>`;

  const rows = DIMS.map((d,i)=>FACES.map(face=>{
    const idx = face==="Say" ? i : i+9;
    const a = va[idx], b = vb[idx];
    const diff = (a!==null && b!==null) ? Math.abs(a-b) : null;
    const colour = diff===null?"var(--ink-3)":diff===0?"var(--good)":diff===1?"var(--warn)":"var(--bad)";
    return `<tr>
      <td><strong>D${d.n} ${face}</strong><div class="ar">${esc(d.ar)}</div></td>
      <td class="num">${a===null?"·":a}</td>
      <td class="num">${b===null?"·":b}</td>
      <td class="num" style="color:${colour}">${diff===null?"·":diff===0?"=":"±"+diff}</td></tr>`;
  }).join("")).join("");

  el.innerHTML = `
  <div class="card">
    <h3>Inter-coder reliability</h3>
    <div class="arh">ثبات الترميز بين المُرمِّزَين — الحد المطلوب κ ≥ ٠٫٧٠</div>
    <div class="row">
      <div class="field" style="width:260px"><label>First set <span>المجموعة الأولى</span></label>${sel(0,PAIR[0])}</div>
      <div class="field" style="width:260px"><label>Second set <span>المجموعة الثانية</span></label>${sel(1,PAIR[1])}</div>
    </div>
    ${sameOrg ? "" : `<p class="note" style="color:var(--bad);margin-bottom:12px">
      These two sets are for different organizations; κ compares the same organization coded twice.
      <em>المجموعتان تخصّان منظمتين مختلفتين، والمعامل يقارن منظمةً واحدة رُمِّزت مرتين.</em></p>`}
    <div class="kgrid">
      <div class="kbox"><div class="k">κ</div>
        <div class="v" style="color:${pass?"var(--good)":"var(--bad)"}">${kw===null?"—":kw.toFixed(3)}</div>
        <div class="n">${esc(lab[0])}<em>${esc(lab[1])}</em></div></div>
      <div class="kbox"><div class="k">Threshold ≥ 0.70</div>
        <div class="v" style="color:${pass?"var(--good)":"var(--bad)"}">${kw===null?"—":(pass?"Met":"Not met")}</div>
        <div class="n">${exact} of ${pairs.length} cells agree<em>${exact} من ${pairs.length} متطابقة</em></div></div>
    </div>
    <div class="scroll"><table>
      <tr><th>Cell <div class="ar">الخلية</div></th>
          <th>${esc(A.coder)}</th><th>${esc(B.coder)}</th><th>Δ</th></tr>
      ${rows}</table></div>
    <p class="note" style="margin-top:12px;color:var(--warn)">κ is recorded before any score is changed.
      <em>يُسجَّل معامل كابا قبل تعديل أي درجة؛ فالفصل الرابع يعتمد قيمته على الترميز الأول المستقل.</em></p>
  </div>`;
}

      <em>تسعة أبعاد تُرمَّز من ٠ إلى ٣ على وجه واحد، فيكون حاصلها ٢٧، وهو أقصى ما يبلغه وجه واحد.</em></p>

  </div>
  <div class="card">

      <tr><th style="width:56px">Score <div class="ar">الدرجة</div></th>

          <th style="color:var(--do)">Do — documented practice <div class="ar">الفعل</div></th></tr>
      ${gen}</table></div>
  </div>
  <div class="card">
    <h3>Coding rules</h3><div class="arh">قواعد الترميز</div>
    <div class="scroll"><table><tr><th style="width:40px">#</th>
      <th>Rule <div class="ar">القاعدة</div></th></tr>${rules}</table></div>

document.getElementById("theme").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
});

document.addEventListener("click", e=>{
  const tab = e.target.closest(".tab");
  if(tab){ TAB = tab.dataset.tab; render(); return; }
  if(e.target.id === "getform"){ downloadForm(); return; }
  if(e.target.closest("#drop")){ document.getElementById("files").click(); return; }
  if(e.target.closest("#adrop")){ document.getElementById("afiles").click(); return; }
  if(e.target.id === "a-add"){ addPasted(); return; }
  if(e.target.id === "getrules"){ rulesCSV(); return; }
  if(e.target.id === "aitoggle"){ AIONLY = !AIONLY; renderAnalyse(); return; }
  const dd = e.target.closest("[data-docdel]");
  if(dd){ DOCS.splice(+dd.dataset.docdel,1); HITS = DOCS.length ? buildIndex() : null;
          render(); return; }
  const ask = e.target.closest("[data-ask]");
  if(ask && !ask.disabled){ askClaude(+ask.dataset.ask); return; }
  const cp = e.target.closest("[data-copytext]");
  if(cp){
    const txt = cp.dataset.copytext;
    const done = ()=>{ cp.textContent = "Copied — تم"; setTimeout(()=>cp.textContent="Copy — نسخ",1800); };
    try{ navigator.clipboard.writeText(txt).then(done, ()=>{}); }catch(err){}
    return;
  }
  const del = e.target.closest("[data-del]");
  if(del){ SETS = SETS.filter(s=>s.id !== +del.dataset.del);
           PAIR = [0, SETS.length>1?1:0]; render(); return; }
  if(e.target.id === "copylog"){
    const box = document.getElementById("logbox"), msg = document.getElementById("copymsg");
    const done = ()=>{ msg.textContent = "Copied — تم النسخ"; setTimeout(()=>msg.textContent="",2600); };
    const fallback = ()=>{ box.focus(); box.select();
      msg.textContent = "Selected — press ⌘/Ctrl+C — حُدِّد النص — ⌘/Ctrl+C"; };
    try{ navigator.clipboard.writeText(box.value).then(done, fallback); }catch(err){ fallback(); }
    return;
  }
});

document.addEventListener("change", e=>{
  if(e.target.id === "files"){ addFiles(e.target.files); e.target.value = ""; return; }
  if(e.target.id === "afiles"){ addDocs(e.target.files); e.target.value = ""; return; }
  if(e.target.dataset.pair !== undefined){
    PAIR[+e.target.dataset.pair] = +e.target.value; renderRel(); return;
  }
});

document.addEventListener("dragover", e=>{
  const d = e.target.closest("#drop, #adrop"); if(!d) return;
  e.preventDefault(); d.classList.add("over");
});
document.addEventListener("dragleave", e=>{
  const d = e.target.closest("#drop, #adrop"); if(d) d.classList.remove("over");
});
document.addEventListener("drop", e=>{
  const d = e.target.closest("#drop, #adrop"); if(!d) return;
  e.preventDefault(); d.classList.remove("over");
  if(!e.dataTransfer || !e.dataTransfer.files) return;
  if(d.id === "adrop") addDocs(e.dataTransfer.files); else addFiles(e.dataTransfer.files);
});

/* A Do artifact is a by-product of something that already happened.
   Arabic alternatives carry no \b: JavaScript word boundaries are ASCII-only. */
const DO_SIGNALS = [
 ["a dated statement", /\b(19|20)\d{2}\b|[٠-٩]{4}/],
 ["a named standard", /\b(ISO\/IEC|ISO)\s?\d{4,5}\b|\bSOC\s?2\b|\bNIST SP\b|\bPDPL\b|\bGDPR\b|الأيزو|نظام حماية البيانات الشخصية/i],

 ["a disclosed proportion", /\d+(\.\d+)?\s?%|[٠-٩]+\s?٪|٪/],
 ["a disclosed quantity", /\b\d{1,3}(,\d{3})+\b|\b\d+\s+(models|systems|hours|reviews|incidents|cases|assessments|audits|reports|employees|domains|principles|countries|markets|products|deployments)\b|\d+\s*(نموذجاً|نظاماً|حالة|تقريراً|مراجعة|ساعة|دولة|مبدأ|موظف)/i],
 ["a named artifact", /\bmodel card|\bsystem card|\bdata card|\btransparency report|\baudit report|\bassessment report|\bimpact assessment|\brisk register|\bterms of reference|\bannual report|\bsustainability report|\bwhite ?paper|\bincident log|بطاقة نموذج|تقرير شفافية|تقرير تدقيق|تقرير سنوي|تقرير الاستدامة|لائحة اختصاصات|سجل المخاطر/i],
 ["a completed act", /\bwas (conducted|completed|published|certified|audited|assessed|reviewed|established|launched|implemented|deployed)\b|\bwe (conducted|completed|published|audited|assessed|certified|reviewed|established|launched|implemented|deployed|trained|withdrew|suspended)\b|\bhave been (audited|certified|published|assessed|reviewed)\b|تم إجراء|تم نشر|تم اعتماد|تمّ |أُجري|أجرينا|نُشر|نشرنا|اعتُمد|حصلنا|أصدرنا|راجعنا|دقّقنا|طبّقنا|أنشأنا/i],
 ["an external party", /\bthird[- ]party\b|\bindependent (audit|assessor|review|evaluation)|\bexternal (audit|review|assessor|evaluation)|طرف ثالث|تدقيق خارجي|جهة مستقلة|مدقق خارجي/i]
];

/* A Say artifact is a statement about intended or claimed conduct. */
const SAY_SIGNALS = [
 ["a commitment", /\b(we|our)\s+(are\s+)?commit(ted|ment|s)?\b|\bcommitment to\b|نلتزم|يلتزم|ملتزم|التزامنا|التزام |تعهد|نتعهد/i],

 ["a future tense", /\bwill\b|\bshall\b|\bintends? to\b|\bplans? to\b|\bgoing to\b|\bcontinue to\b|سوف|سنقوم|سنعمل|سنواصل|سيتم|ستقوم/i],

let DOCS = [];     // [{name, segments:[{loc, text}]}]
let HITS = null;   // computed index

const stripTags = s => s.replace(/<script[\s\S]*?<\/script>/gi," ")
                        .replace(/<style[\s\S]*?<\/style>/gi," ")
                        .replace(/<[^>]+>/g," ");
const squash = s => s.replace(/ /g," ").replace(/[ \t]+/g," ")
                     .replace(/\n{3,}/g,"\n\n").trim();

function paragraphs(text, label){
  return squash(text).split(/\n\s*\n/)
    .map(t=>t.replace(/\s+/g," ").trim())
    .filter(t=>t.length >= 40)
    .map((t,i)=>({loc:`${label} ${i+1}`, text:t}));
}

async function readPdf(buf, name){
  if(typeof pdfjsLib === "undefined")
    throw new Error("PDF reading is unavailable here. Save the document as .txt, or paste its text below.");
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const segs = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const txt = squash(tc.items.map(i=>i.str).join(" "));
    txt.split(/(?<=[.!?؟۔])\s+(?=[A-Z؀-ۿ])/)
       .reduce((acc,s)=>{  // group short sentences into readable passages
         if(!acc.length || (acc[acc.length-1] + " " + s).length > 420) acc.push(s);
         else acc[acc.length-1] += " " + s;
         return acc;
       }, [])
       .filter(t=>t.trim().length >= 40)
       .forEach(t=>segs.push({loc:`p. ${p}`, text:t.trim()}));
  }
  return {name, segments:segs};
}

/* does the passage name AI at all? only such passages can carry a cell above level 1 */
const AI_RE = /\bAI\b|artificial intelligence|machine learning|\bLLMs?\b|\bVLMs?\b|generative|model card|AI model|foundation model|algorithm|deep ?fake|prompt injection|agentic|chatbot|\u0627\u0644\u0630\u0643\u0627\u0621 \u0627\u0644\u0627\u0635\u0637\u0646\u0627\u0639\u064a|\u062a\u0639\u0644\u0645 \u0627\u0644\u0622\u0644\u0629|\u0627\u0644\u062e\u0648\u0627\u0631\u0632\u0645\u064a|\u0646\u0645\u0627\u0630\u062c \u0644\u063a\u0648\u064a\u0629/i;
let AIONLY = true;

function fired(list, text){
  return list.filter(([,re])=>re.test(text)).map(([label])=>label);
}

function buildIndex(){
  const out = TERMS.map(t=>({n:t.n, passages:[]}));
  DOCS.forEach(doc=>{
    doc.segments.forEach(seg=>{
      const low = seg.text.toLowerCase();
      TERMS.forEach((t,i)=>{
        const hitEn = t.en.filter(w=>low.includes(w));
        const hitAr = t.ar.filter(w=>seg.text.includes(w));
        const matched = hitEn.concat(hitAr);
        if(!matched.length) return;
        const d = fired(DO_SIGNALS, seg.text);
        const s = fired(SAY_SIGNALS, seg.text);
        const verdict = d.length > s.length ? "do" : s.length > d.length ? "say" : "both";
        out[i].passages.push({doc:doc.name, loc:seg.loc, text:seg.text,
                              terms:matched, doSig:d, saySig:s, verdict,
                              ai: AI_RE.test(seg.text)});
      });
    });
  });
  // the clearest evidence first
  out.forEach(o=>o.passages.sort((a,b)=>
    (b.ai - a.ai) ||
    (b.doSig.length + b.saySig.length) - (a.doSig.length + a.saySig.length)));
  return out;
}

async function addDocs(list){
  const files = Array.from(list);
  const msg = document.getElementById("a-msg");
  for(const file of files){
    if(msg) msg.textContent = `Reading ${file.name}…`;
    try{
      if(/\.pdf$/i.test(file.name)){
        const buf = new Uint8Array(await file.arrayBuffer());
        DOCS.push(await readPdf(buf, file.name));
      } else {
        let txt = await file.text();
        if(/\.html?$/i.test(file.name)) txt = stripTags(txt);
        DOCS.push({name:file.name, segments:paragraphs(txt, "para.")});
      }
    }catch(err){
      DOCS.push({name:file.name, segments:[], error:err.message});
    }
  }
  if(msg) msg.textContent = "";
  HITS = buildIndex();
  render();
}

function addPasted(){
  const ta = document.getElementById("a-paste");
  const nm = document.getElementById("a-name");
  const txt = ta.value.trim();
  if(!txt) return;
  DOCS.push({name: nm.value.trim() || "Pasted text",
             segments: paragraphs(txt, "para.")});
  ta.value = "";
  HITS = buildIndex();
  render();
}

function rulesCSV(){
  const rows = [["Section","Item","English","العربية","Example"]];
  TERMS.forEach(t=>rows.push(["Dimension terms", "D"+t.n, t.en.join(" | "), t.ar.join(" | "), ""]));
  DO_SIGNALS.forEach(([n])=>{ const g = GLOSS[n]||["","",""];
    rows.push(["Traces of an act", n, g[0], g[1], g[2]]); });
  SAY_SIGNALS.forEach(([n])=>{ const g = GLOSS[n]||["","",""];
    rows.push(["Commitment language", n, g[0], g[1], g[2]]); });
  DO_SIGNALS.concat(SAY_SIGNALS).forEach(([n,re])=>
    rows.push(["Pattern as coded", n, String(re), "", ""]));
  const blob = new Blob([toCSV(rows)], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const el = document.createElement("a");
  el.href = url; el.download = "say-do_reading_rules.csv";
  document.body.appendChild(el); el.click(); el.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

async function askClaude(n){
  if(!SAMPLE || !HITS) return;
  const d = DIMS[n-1];
  const h = HITS.find(x=>x.n === n);
  if(!h || !h.passages.length) return;
  AI[n] = {loading:true};
  renderAnalyse();

  const crit = ["say","do"].map(f=>
    (f === "say" ? "SAY criteria (what the organization declares):\n"
                 : "DO criteria (what a retrievable artifact shows it does):\n") +
    d[f].map((c,i)=>`${i} = ${c[0]}`).join("\n")).join("\n\n");

  const passages = h.passages.slice(0,14)
    .map((p,i)=>`[${i+1}] (${p.doc}, ${p.loc}) ${p.text}`).join("\n\n");

  const prompt =
`You are assisting a content-analysis study that scores an organization on the dimension below, twice: once for what it declares (Say) and once for what published artifacts show it does (Do). Each face is scored 0 to 3 against the stated criteria. Assign the highest level whose criterion is fully satisfied by the passages given. A statement of intention is never Do evidence. If no passage supports a level above 0, say 0.

DIMENSION ${d.n}: ${d.en}

${crit}

PASSAGES RETRIEVED FROM THE ORGANIZATION'S DOCUMENTS:

${passages}

Reply with JSON only, no other text:
{"say": <0-3>, "sayPassage": <passage number or 0>, "sayWhy": "<one sentence: why this level and not the one above>",
 "do": <0-3>, "doPassage": <passage number or 0>, "doWhy": "<one sentence: why this level and not the one above>"}`;

  try{
    const r = await SAMPLE.json(prompt, {modelTier:"complex"});
    AI[n] = {data:r, when:new Date().toISOString().slice(0,16).replace("T"," ")};
  }catch(err){
    AI[n] = {error:(err && err.message) || "The request was refused."};
  }
  renderAnalyse();
}

function aiBlock(n){
  if(!SAMPLE) return "";
  const st = AI[n];
  const btn = `<button class="btn mini" data-ask="${n}" style="margin:0"
      ${st && st.loading ? "disabled" : ""}>${st && st.loading
      ? "Reading… — جارٍ القراءة" : "Ask Claude to suggest a score — اطلب اقتراحاً"}</button>`;
  if(!st || st.loading) return `<div class="airow">${btn}</div>`;
  if(st.error) return `<div class="airow">${btn}
    <span class="note" style="color:var(--bad)">${esc(st.error)}</span></div>`;
  const r = st.data || {};
  const cell = (face, score, pass, why) => `
    <div class="aicell">
      <div class="k">${face}</div>
      <div class="v" style="color:var(--${face === "Say" ? "say" : "do"})">${esc(String(score))}</div>
      <div class="n">${pass ? "from passage " + esc(String(pass)) : "no supporting passage"}
        <em>${esc(why || "")}</em></div>
    </div>`;
  return `<div class="airow">${btn}</div>
    <div class="aibox">
      <div class="aigrid">
        ${cell("Say", r.say, r.sayPassage, r.sayWhy)}
        ${cell("Do", r.do, r.doPassage, r.doWhy)}
      </div>
      <p class="note" style="margin:10px 0 0">A suggestion, not a score. It is not reproducible: the same request can return a different answer, so it is never recorded as the study's value. Generated ${esc(st.when || "")}.
        <em>اقتراح لا درجة. وهو غير قابل للتكرار، إذ قد يعطي الطلب نفسه جواباً مختلفاً، فلا يُسجَّل قيمةً للدراسة.</em></p>
    </div>`;
}

/* every binding is now initialised */
render();
</script>

</html>
